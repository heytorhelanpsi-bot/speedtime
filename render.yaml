# Deploy em 1 clique no Render (New → Blueprint → escolha este repositório).
# Cria: o app SpeedTime (site + API + worker num único serviço), o banco Postgres e o Redis.
# Nenhuma variável precisa ser preenchida à mão: tabelas, segredo de login e chaves do
# Web Push são criados automaticamente na primeira inicialização.
databases:
  - name: speedtime-db
    plan: basic-256mb
    databaseName: speedtime

services:
  - type: keyvalue
    name: speedtime-redis
    plan: free
    maxmemoryPolicy: noeviction   # obrigatório para o BullMQ
    ipAllowList: []               # acesso só pela rede interna do Render

  - type: web
    name: speedtime
    runtime: node
    plan: starter                 # o plano "free" dorme após 15 min sem acesso e pararia o monitoramento 24/7
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: speedtime-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: speedtime-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
