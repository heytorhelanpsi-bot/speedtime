# Deploy GRATUITO no Render (New → Blueprint → escolha este repositório).
#
# Cria o app SpeedTime (site + API + worker num único serviço, plano Free) e o Redis (Free).
# O banco Postgres fica no Supabase (plano gratuito): durante a criação, o Render pede
# o valor de DATABASE_URL — cole a "Session pooler" connection string do Supabase.
#
# KEEP_ALIVE=true faz o app acessar a própria URL a cada 10 min, para o plano Free
# não "dormir" e o monitoramento continuar 24/7 (um serviço cabe nas 750 h/mês grátis).
# Tabelas, segredo de login e chaves do Web Push são criados automaticamente.
services:
  - type: keyvalue
    name: speedtime-redis
    plan: free
    maxmemoryPolicy: noeviction   # obrigatório para o BullMQ
    ipAllowList: []               # acesso só pela rede interna do Render

  - type: web
    name: speedtime
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER
        value: "true"
      - key: KEEP_ALIVE
        value: "true"
      - key: DATABASE_URL
        sync: false               # o Render pede este valor ao criar: cole a URL do Supabase
      - key: REDIS_URL
        fromService: { type: keyvalue, name: speedtime-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
